<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Order received | Blended Krewe Creations</title>
  <link rel="icon" href="https://cdn.creativeclaw.co/u/c129bbd3/images/e6ccf6b3-dcf0-4c33-902d-b63ebeb07346.png">
  <style>
    :root{--green:#183229;--gold:#c69a4b;--cream:#f4ecdf;--paper:#fffaf2;--ink:#211f19;--muted:#716f64;--line:#d7c7ae}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(180deg,#faf5ec,#efe4d3);font-family:Inter,Arial,sans-serif;color:var(--ink)}
    .card{max-width:620px;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:38px;box-shadow:0 18px 60px rgba(24,50,41,.12);text-align:center}
    img{width:110px;height:110px;border-radius:50%;margin:0 auto 18px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:800;color:#8b493b}
    h1{font:700 clamp(44px,8vw,68px)/.95 Georgia,serif;color:var(--green);margin:10px 0 18px}.order{display:inline-block;background:#efe3d1;border:1px solid var(--line);padding:10px 14px;border-radius:999px;font-weight:800;color:var(--green)}
    p{color:var(--muted);line-height:1.65}.btn{display:inline-block;margin-top:16px;background:var(--green);color:white;text-decoration:none;padding:13px 20px;border-radius:999px;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <img src="https://cdn.creativeclaw.co/u/c129bbd3/images/e6ccf6b3-dcf0-4c33-902d-b63ebeb07346.png" alt="Blended Krewe Creations">
    <div class="eyebrow">Payment received</div>
    <h1>Your order is in the Krewe.</h1>
    <p class="order" id="order-number">Order received</p>
    <p>We’ll move it through production and send your tracking information as soon as it ships.</p>
    <a class="btn" href="/">Back to Blended Krewe</a>
  </main>
  <script>
    localStorage.removeItem("blendedKreweCartV1");
    const params=new URLSearchParams(location.search);
    const order=params.get("order");
    if(order)document.getElementById("order-number").textContent=order;
  </script>
</body>
</html>
